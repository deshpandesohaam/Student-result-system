<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Result Management System</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #74b9ff, #a29bfe);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 40px 50px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 380px;
    }

    h1 {
      color: #2d3436;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background-color: #0984e3;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #0652DD;
    }

    .student {
      background-color: #00b894;
    }

    .student:hover {
      background-color: #019875;
    }

    p {
      margin-top: 20px;
      color: #636e72;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎓 Student Result System</h1>
    <p>Welcome! Please choose your portal:</p>
    <button class="teacher" onclick="window.location.href='login.html'">👩‍🏫 Teacher Login</button>
    <button class="student" onclick="window.location.href='student.html'">🎓 Student Result</button>
  </div>
</body>
</html>
